<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self' https://code.jquery.com https://cdn.jsdelivr.net;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src https://fonts.googleapis.com https://fonts.gstatic.com;
                 base-uri 'none';
                 form-action 'none';">
    <title>短冊文字入れツール</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Zen+Kurenaido&display=swap" rel="stylesheet">
    <!-- UI操作、ドラッグ、縦書き描画に使用する外部ライブラリ（バージョン固定 + SRIで改ざん検知） -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.28/dist/interact.min.js"
        integrity="sha384-M8D+RMAiR0totYNPoldHamQ91OX9eGv5aR15538+pfeV/zsOqt4HYh2nyC8RPZUR"
        crossorigin="anonymous"></script>
    <!-- 縦書き描画ライブラリ。jsDelivrの自動生成minifyはSRIと非互換のため未minifyの配布ファイルを使用 -->
    <script src="https://cdn.jsdelivr.net/npm/@mogamoga1024/vertical-text-canvas@1.0.11/vertical_text_canvas.js"
        integrity="sha384-tVsbinCt+CYQuf5WN0ulJWiXZ9g/WEtNn6/vtNH6ar6CJ+236DW776OH9ExMARqj"
        crossorigin="anonymous"></script>
</head>

<body>

    <!-- メイン画面 -->
    <div class="main-container">
        <!-- 画像上のテキストボックスを操作するツールバー -->
        <div class="buttons">
            <img src="img/add.png" id="addBtn" alt="追加">
            <img src="img/settings.png" id="settingsBtn" alt="設定">
            <img src="img/download.png" id="downloadBtn" alt="ダウンロード">
            <img src="img/delete.png" id="deleteBtn" class="delete-action" alt="削除">
        </div>

        <!-- 背景画像、文字Canvas、選択用の枠を同じ座標系で重ねる -->
        <div class="image-area">
            <img id="baseImage" src="img/tanzaku.png" alt="背景画像">
            <canvas id="textCanvas"></canvas>
            <div id="textBoxes" aria-label="文字の描画エリア"></div>
        </div>
    </div>

    <!-- 画面下部から開く操作メニュー -->
    <div id="bottomSheet" class="bottom-sheet" aria-hidden="true">
        <div class="bottom-sheet-backdrop" data-close-sheet></div>
        <section class="bottom-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="bottomSheetTitle">
            <div class="bottom-sheet-handle" aria-hidden="true"></div>
            <div class="bottom-sheet-header">
                <h2 id="bottomSheetTitle">文字の設定</h2>
                <button id="closeSheet" class="sheet-close" type="button" aria-label="メニューを閉じる">×</button>
            </div>
            <label class="sheet-text-label" for="textInput">短冊に入れる文字</label>
            <textarea id="textInput" placeholder="短冊に入れる文字を入力"></textarea>
            <button id="applyText" class="sheet-action" type="button">内容を反映</button>
            <div class="sheet-controls">
                <div class="sheet-control">
                    <label for="sheetFontSizeSlider">フォントサイズ</label>
                    <span id="sheetFontSizeValue">36</span>
                    <input type="range" id="sheetFontSizeSlider" min="12" max="60" value="36">
                </div>
                <div class="sheet-control">
                    <label for="sheetLineHeightSlider">行間</label>
                    <span id="sheetLineHeightValue">1.5</span>
                    <input type="range" id="sheetLineHeightSlider" min="1" max="3" step="0.1" value="1.5">
                </div>
            </div>
        </section>
    </div>

    <!-- 選択中テキストボックスの削除確認モーダル -->
    <div id="deleteConfirm" class="modal">
        <div class="modal-content confirm-content">
            <p>現在選択しているテキストボックスを削除しますか？</p>
            <div class="confirm-buttons">
                <button id="confirmDelete">はい</button>
                <button id="cancelDelete">いいえ</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
