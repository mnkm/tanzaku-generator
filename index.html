<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self' https://static.cloudflareinsights.com;
                 style-src 'self' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'self';
                 connect-src https://fonts.googleapis.com https://fonts.gstatic.com https://cloudflareinsights.com;
                 base-uri 'none';
                 form-action 'none';">
    <title>短冊文字入れツール</title>
    <meta name="description" content="PROJECT NEBULA（ぷろねぶ）所属のVTuber 碓氷ゆら考案企画「ゆら姫に願いを」で紹介する短冊の作成を支援するツール">
    <link rel="canonical" href="https://mnkm.page/tanzaku-generator/">
    <!-- 構造化データ（検索エンジン向けのサイト情報。実行されないデータなのでCSPの対象外） -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "短冊文字入れツール",
        "url": "https://mnkm.page/tanzaku-generator/",
        "inLanguage": "ja",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "description": "PROJECT NEBULA（ぷろねぶ）所属のVTuber 碓氷ゆら考案企画「ゆら姫に願いを」で紹介する短冊の作成を支援するツール",
        "about": [
            { "@type": "Person", "name": "碓氷ゆら" },
            { "@type": "Organization", "name": "PROJECT NEBULA", "alternateName": "ぷろねぶ" }
        ]
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Zen+Kurenaido&display=swap" rel="stylesheet">
    <!-- UI操作、ドラッグ、縦書き描画に使用するライブラリ（CDNを使わず、npmで管理してjs/vendorから読み込む。版はpackage.json参照） -->
    <script src="./js/vendor/jquery.min.js"></script>
    <script src="./js/vendor/interact.min.js"></script>
    <script src="./js/vendor/vertical_text_canvas.js"></script>
</head>

<body>

    <!-- 検索エンジンと読み上げ向けの見出し（画面には表示しない） -->
    <h1 class="visually-hidden">短冊文字入れツール</h1>

    <!-- サイトの説明。画面右上のボタンで開閉し、閉じている間はレイアウトに影響しない -->
    <details class="site-about">
        <summary aria-label="このサイトについて"><img src="./img/information.svg" alt=""></summary>
        <p>PROJECT NEBULA（ぷろねぶ）所属のVTuber 碓氷ゆら考案企画「ゆら姫に願いを」で紹介する短冊の作成を支援するツールです。</p>
    </details>

    <!-- メイン画面 -->
    <div class="main-container">
        <!-- 画像上のテキストボックスを操作するツールバー -->
        <div class="buttons">
            <img src="./img/add.png" id="addBtn" alt="追加">
            <img src="./img/settings.png" id="settingsBtn" alt="設定">
            <img src="./img/download.png" id="downloadBtn" alt="ダウンロード">
            <img src="./img/delete.png" id="deleteBtn" class="delete-action" alt="削除">
        </div>

        <!-- 背景画像、文字Canvas、選択用の枠を同じ座標系で重ねる -->
        <div class="image-area">
            <img id="baseImage" src="./img/tanzaku.png" alt="ゆら姫に願いを 短冊テンプレート">
            <canvas id="textCanvas"></canvas>
            <div id="textBoxes" aria-label="文字の描画エリア"></div>
        </div>
    </div>

    <!-- 画面下部から開く操作メニュー -->
    <div id="bottomSheet" class="bottom-sheet" aria-hidden="true">
        <div class="bottom-sheet-backdrop" data-close-sheet></div>
        <section class="bottom-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="bottomSheetTitle">
            <div class="bottom-sheet-handle" aria-hidden="true"></div>
            <div class="bottom-sheet-header">
                <h2 id="bottomSheetTitle">文字の設定</h2>
                <button id="closeSheet" class="sheet-close" type="button" aria-label="メニューを閉じる">×</button>
            </div>
            <label class="sheet-text-label" for="textInput">短冊に入れる文字</label>
            <textarea id="textInput" maxlength="500" placeholder="短冊に入れる文字を入力"></textarea>
            <button id="applyText" class="sheet-action" type="button">内容を反映</button>
            <div class="sheet-controls">
                <div class="sheet-control">
                    <label for="sheetFontSizeSlider">フォントサイズ</label>
                    <span id="sheetFontSizeValue">36</span>
                    <input type="range" id="sheetFontSizeSlider" min="12" max="60" value="36">
                </div>
                <div class="sheet-control">
                    <label for="sheetLineHeightSlider">行間</label>
                    <span id="sheetLineHeightValue">1.5</span>
                    <input type="range" id="sheetLineHeightSlider" min="1" max="3" step="0.1" value="1.5">
                </div>
            </div>
        </section>
    </div>

    <!-- 選択中テキストボックスの削除確認モーダル -->
    <div id="deleteConfirm" class="modal">
        <div class="modal-content confirm-content">
            <p>現在選択しているテキストボックスを削除しますか？</p>
            <div class="confirm-buttons">
                <button id="confirmDelete">はい</button>
                <button id="cancelDelete">いいえ</button>
            </div>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>

</html>
